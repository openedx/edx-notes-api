name: Migrations check on MySQL 8

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master

jobs:
  check_migrations:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
        mysql-version: ["8"]
    services:
      mysql:
        image: mysql:${{ matrix.mysql-version }}
        ports:
          - 3306:3306
        env:
          MYSQL_DATABASE: "edxapp"
          MYSQL_USER: "edxapp001"
          MYSQL_PASSWORD: "password"
          MYSQL_RANDOM_ROOT_PASSWORD: true
        # Ping over TCP, not the socket. On first start the image creates the
        # database and user using a temporary server with networking turned off,
        # so a socket ping can report healthy before MySQL accepts connections.
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }} with cache
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: "**/pip-tools.txt"

      # mysqlclient is built from source below and needs the client headers.
      # --no-upgrade leaves the image's own MySQL packages alone: upgrading the
      # client pulls in a mysql-server upgrade whose post-install script fails
      # on ubuntu-26.04 runners.
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y --no-upgrade libxmlsec1-dev libmysqlclient-dev mysql-client pkg-config

      - name: Install Python dependencies
        run: |
          pip install -r requirements/pip-tools.txt
          pip install -r requirements/test.txt
          pip install -r requirements/base.txt
          pip uninstall -y mysqlclient
          pip install --no-binary mysqlclient mysqlclient

      - name: Verify MySQL credentials
        run: mysql -h 127.0.0.1 -uedxapp001 -ppassword -e "select version();" edxapp

      - name: Run migrations
        env:
          DB_ENGINE: django.db.backends.mysql
          DB_NAME: edxapp
          DB_USER: edxapp001
          DB_PASSWORD: password
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
        run: python manage.py migrate --settings=notesserver.settings.test
